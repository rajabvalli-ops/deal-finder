# Local development database. Credentials are for local use only.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dealfinder
      POSTGRES_PASSWORD: dealfinder
      POSTGRES_DB: dealfinder
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealfinder -d dealfinder"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
