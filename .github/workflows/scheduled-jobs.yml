# Runs the site's background jobs on a schedule by calling /api/cron/<job> on the live site.
# Lives here rather than in vercel.json because Vercel's free plan only allows daily cron jobs.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SITE_URL     the live site, e.g. https://deal-broker.vercel.app
#   CRON_SECRET  the same value as the CRON_SECRET environment variable on Vercel
# Until both are set, every run skips quietly.
name: Scheduled jobs

on:
  schedule:
    - cron: "17 4 * * *" # import-catalogue, daily
    - cron: "7 */3 * * *" # refresh-prices, every 3 hours
    - cron: "37 * * * *" # detect-deals, hourly
    - cron: "47 * * * *" # expire-deals, hourly
    - cron: "52 * * * *" # process-alerts, hourly
    - cron: "27 * * * *" # post-social, hourly
  workflow_dispatch:
    inputs:
      job:
        description: Job to run now
        required: true
        type: choice
        options:
          - import-catalogue
          - refresh-prices
          - detect-deals
          - expire-deals
          - process-alerts
          - post-social

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the job endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_JOB: ${{ inputs.job }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL or CRON_SECRET secret not set; skipping."
            exit 0
          fi
          case "$SCHEDULE" in
            "17 4 * * *") JOB=import-catalogue ;;
            "7 */3 * * *") JOB=refresh-prices ;;
            "37 * * * *") JOB=detect-deals ;;
            "47 * * * *") JOB=expire-deals ;;
            "52 * * * *") JOB=process-alerts ;;
            "27 * * * *") JOB=post-social ;;
            *) JOB="$INPUT_JOB" ;;
          esac
          echo "Running $JOB"
          curl --fail-with-body --silent --show-error --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${SITE_URL%/}/api/cron/$JOB"
